<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>FinanZ - Pruebas TDD</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f1f5f9; padding: 20px; }
    .pasa { color: #22c55e; }
    .falla { color: #ef4444; }
    h1 { color: #3b82f6; }
  </style>
</head>
<body>
  <h1>Pruebas TDD - FinanZ</h1>
  <div id="resultados"></div>

  <script>
    // Copia de la lógica de negocio (idéntica a app.js)
    const CalculadoraFinanciera = {
      calcularDisponibilidad: (i, g) => i - g,
      calcularCapacidadAhorro: (i, g) => (i < g ? 0 : i - g),
      calcularMesesParaMeta: (m, a) => {
        if (a <= 0) throw new Error('El ahorro mensual debe ser positivo');
        return Math.round((m / a) * 10) / 10;
      },
      calcularMesesReales: (m, a) => (a <= 0 ? Infinity : Math.ceil(m / a))
    };

    // Mini framework de pruebas
    const pruebas = [];
    const test = (nombre, fn) => pruebas.push({ nombre, fn });
    const esperar = (actual, esperado) => {
      if (actual !== esperado)
        throw new Error(`Esperado ${esperado}, obtenido ${actual}`);
    };

    // ---------- CASOS DEL DOCUMENTO (TDD) ----------
    test('Disponibilidad: ingreso 25000 - gastos 14900 = 10100', () => {
      esperar(CalculadoraFinanciera.calcularDisponibilidad(25000, 14900), 10100);
    });

    test('Capacidad de ahorro: ingreso 25000 - gastos 14900 = 10100', () => {
      esperar(CalculadoraFinanciera.calcularCapacidadAhorro(25000, 14900), 10100);
    });

    test('Capacidad de ahorro nunca negativa (gastos > ingresos)', () => {
      esperar(CalculadoraFinanciera.calcularCapacidadAhorro(25000, 30000), 0);
    });

    test('Tiempo para meta: 12000 / 5000 = 2.4 meses', () => {
      esperar(CalculadoraFinanciera.calcularMesesParaMeta(12000, 5000), 2.4);
    });

    test('Tiempo real: 12000 / 5000 = 3 meses completos', () => {
      esperar(CalculadoraFinanciera.calcularMesesReales(12000, 5000), 3);
    });

    test('Ahorro mensual <= 0 debe lanzar error', () => {
      let lanzo = false;
      try { CalculadoraFinanciera.calcularMesesParaMeta(12000, 0); }
      catch { lanzo = true; }
      esperar(lanzo, true);
    });

    // ---------- EJECUTAR ----------
    const cont = document.getElementById('resultados');
    let pasadas = 0;
    pruebas.forEach((p) => {
      const div = document.createElement('div');
      try {
        p.fn();
        div.className = 'pasa';
        div.textContent = '✓ ' + p.nombre;
        pasadas++;
      } catch (e) {
        div.className = 'falla';
        div.textContent = '✗ ' + p.nombre + ' → ' + e.message;
      }
      cont.appendChild(div);
    });

    const resumen = document.createElement('h2');
    resumen.textContent = `${pasadas}/${pruebas.length} pruebas pasaron`;
    resumen.style.color = pasadas === pruebas.length ? '#22c55e' : '#ef4444';
    cont.appendChild(resumen);
  </script>
</body>
</html>
