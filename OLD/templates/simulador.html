{% extends "layout.html" %}

{% block titulo %}Simulador - FinanZ{% endblock %}
{% block encabezado %}Simulador que pasa si{% endblock %}

{% block contenido %}
<section class="view active">
  <div class="card">
    <h3>Ajustar ahorro mensual</h3>
    <p class="muted">Observa el efecto en tus metas.</p>

    <label>Cambiar mi ahorro mensual a:</label>
    <input type="number" id="sim-ahorro" placeholder="5000" min="0" step="0.01" />

    <button id="btn-simular" class="primary-btn">Simular</button>

    <div id="resultado-sim" class="sim-result"></div>
  </div>
</section>
{% endblock %}
