<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Mis Finanzas</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>Mis Finanzas</h1>
    <button id="btn-theme" class="icon-btn" title="Cambiar tema">🌙</button>
  </header>

  <!-- SALDO -->
  <section class="balance-card">
    <p class="balance-label">Saldo total</p>
    <h2 id="balance" class="balance-amount">$0.00</h2>
    <div class="balance-summary">
      <div>
        <span class="tag income">Ingresos</span>
        <p id="total-income">$0.00</p>
      </div>
      <div>
        <span class="tag expense">Gastos</span>
        <p id="total-expense">$0.00</p>
      </div>
    </div>
  </section>

  <!-- FORMULARIO -->
  <section class="form-card">
    <h3>Nueva transacción</h3>
    <form id="tx-form">
      <input type="text" id="desc" placeholder="Descripción (ej. Café)" required />
      <input type="number" id="amount" placeholder="Monto" step="0.01" min="0.01" required />
      <select id="type">
        <option value="income">Ingreso</option>
        <option value="expense" selected>Gasto</option>
      </select>
      <select id="category">
        <option value="General">General</option>
        <option value="Comida">Comida</option>
        <option value="Transporte">Transporte</option>
        <option value="Hogar">Hogar</option>
        <option value="Salud">Salud</option>
        <option value="Ocio">Ocio</option>
        <option value="Sueldo">Sueldo</option>
      </select>
      <button type="submit" class="primary-btn">Agregar</button>
    </form>
  </section>

  <!-- LISTA -->
  <section class="list-section">
    <div class="list-header">
      <h3>Historial</h3>
      <button id="btn-clear" class="danger-btn">Borrar todo</button>
    </div>
    <ul id="tx-list" class="tx-list"></ul>
    <p id="empty-msg" class="empty-msg">Aún no hay transacciones.</p>
  </section>

  <!-- NAV INFERIOR -->
 <nav class="bottom-nav">
  <button class="active" data-tab="home">🏠 Inicio</button>
  <button id="btn-export">📤 Exportar</button>
  <button id="btn-import">📥 Importar</button>
</nav>
<input type="file" id="file-import" accept=".json" hidden />
  <script src="app.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
